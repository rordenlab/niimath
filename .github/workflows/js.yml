name: JS build

# Exercise the JS package's generated metadata so it can't silently drift/break.
# The operator JSON and TS types are generated (not committed); `prebuild` builds
# niimath, scrapes its help text, regenerates them, and builds the WASM bundle.
on:
  push:
    branches: [master]
    paths: ['js/**', 'src/**', '.github/workflows/js.yml']
  pull_request:
    paths: ['js/**', 'src/**', '.github/workflows/js.yml']

jobs:
  prebuild:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - name: Install niimath build deps
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libzstd-dev
      - uses: oven-sh/setup-bun@v2
      - uses: mymindstorm/setup-emsdk@v14
      - name: Install JS dependencies
        run: bun install
      - name: Regenerate operators/types and build WASM (prebuild)
        run: bun run prebuild
      - name: Type-check generated definitions
        run: ./node_modules/.bin/tsc --noEmit
      # SCOPE, precisely: this step is a PARSE/TYPE check only. It does NOT execute the WASI
      # behavioural suite -- `bun run test` below is `bun test ./tests`, and running src/wasi
      # needs Zig >= 0.16, which AGENTS.md deliberately keeps out of CI so contributors without
      # Zig stay green. What it closes is a real hole with a real history: tsconfig.json
      # excludes src/**/*.test.ts (so tests cannot emit .d.ts into dist/), an unbalanced brace
      # once made featureParity.test.ts fail to LOAD, ~40 assertions vanished, and nothing
      # noticed. Verified by injecting a type error: zero tsc errors before this step, one
      # after. Behavioural WASI coverage remains MANUAL (`bun run test:wasi`); do not describe
      # this step as providing it.
      - name: Type-check test sources (PARSE/TYPE ONLY -- covers src/wasi, not its behaviour)
        run: ./node_modules/.bin/tsc -p tsconfig.tests.json
      # prebuild builds the WASM into src/ but not the dist bundles the runtime
      # tests load. Build dist via esbuild DIRECTLY (not `bun run build`, which would
      # re-trigger the prebuild lifecycle hook), then run the WASM runtime tests so
      # the --qc/BSD callMain paths actually get CI protection. (The package is BSD-only;
      # GPL is no longer built or tested here.)
      - name: Build dist bundles (esbuild)
        run: bun run esbuild.config.ts
      - name: Run WASM runtime tests
        run: bun run test
