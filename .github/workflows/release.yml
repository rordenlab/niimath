name: Release
# Two shapes of the same job, so the wheel build cannot drift between them:
#   * push to master / v*.*.* tag: the full five-runner matrix, and the PyPI upload on a tag;
#   * pull_request / weekly schedule: ONLY the oldest two CPythons on ubuntu-latest.
# The reduced shape exists because the wheel build used to run only after a merge to master, so
# a failure surfaced at release time, and twice it was pure build-dependency drift (an upstream
# release changing what pip could resolve under cibuildwheel's per-Python constraint pins) that
# no PR had touched. The oldest Pythons are where that drift bites -- their constraint files are
# the most aged -- and the constraints are per-Python, not per-OS, so one Linux runner reproduces
# the resolver failure the whole matrix would hit. The weekly run catches drift with no PR open.
on:
  push: {branches: [master], tags: [v*.*.*]}
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
env:
  REDUCED: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' }}
jobs:
  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # a release wants every failing leg reported, not the first one
      matrix:
        # macos-15-intel is an intel runner, macos-14 is apple silicon. The reduced shape
        # provisions only the Linux runner rather than five runners that skip every step.
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest", "macos-15-intel", "macos-14"]' || '["ubuntu-latest"]') }}
    steps:
    - uses: actions/checkout@v4
      with: {fetch-depth: 0, submodules: false}
    - name: Install macOS build deps
      if: startsWith(matrix.os, 'macos')
      run: brew install libomp zstd
    - name: Install Windows zstd
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install zstd:x64-windows-static'
    - uses: pypa/cibuildwheel@2.x
      with: {output-dir: dist}
      env:
        CIBW_ARCHS: auto64
        CIBW_SKIP: pp*  # skip 32bit & PyPy
        # Reduced shape: the two oldest CPythons only -- the package minimum (pyproject.toml
        # requires-python) and the next. Empty means every CPython.
        CIBW_BUILD: ${{ env.REDUCED == 'true' && 'cp37-* cp38-*' || '' }}
        CIBW_CONFIG_SETTINGS: cmake.define.ENABLE_ZSTD=ON cmake.define.OPENMP_XCODE=ON
        CIBW_CONFIG_SETTINGS_WINDOWS: cmake.define.ENABLE_ZSTD=ON cmake.define.ZSTD_ROOT=C:/vcpkg/installed/x64-windows-static
        CIBW_BEFORE_ALL_LINUX: >
          set -eux;
          if command -v curl; then curl -fsSL -o /tmp/zstd.tar.gz https://github.com/facebook/zstd/releases/download/v1.5.6/zstd-1.5.6.tar.gz;
          else wget -O /tmp/zstd.tar.gz https://github.com/facebook/zstd/releases/download/v1.5.6/zstd-1.5.6.tar.gz; fi;
          tar -xzf /tmp/zstd.tar.gz -C /tmp;
          make -C /tmp/zstd-1.5.6/lib -j2 libzstd.a;
          mkdir -p /usr/local/lib /usr/local/include;
          cp /tmp/zstd-1.5.6/lib/libzstd.a /usr/local/lib/;
          cp /tmp/zstd-1.5.6/lib/zstd.h /tmp/zstd-1.5.6/lib/zdict.h /tmp/zstd-1.5.6/lib/zstd_errors.h /usr/local/include/
        CIBW_ENVIRONMENT_WINDOWS: CMAKE_PREFIX_PATH='C:/vcpkg/installed/x64-windows-static'
    - uses: actions/upload-artifact@v4
      if: env.REDUCED != 'true'
      with:
        name: wheels-${{ matrix.os }}-${{ strategy.job-index }}
        path: ./dist/*.whl
  pypi:
    needs: wheels
    if: github.event_name == 'push'
    permissions: {id-token: write}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with: {fetch-depth: 0, submodules: false}
    - uses: actions/setup-python@v5
      with: {python-version: '3.x'}
    - uses: actions/download-artifact@v4
      with:
        pattern: wheels-*
        path: dist
        merge-multiple: true
    - uses: casperdcl/deploy-pypi@v2
      with:
        build: -s
        upload: ${{ startsWith(github.ref, 'refs/tags/v') }}
