[build-system]
requires = [
  "setuptools_scm>=7",
  "scikit-build-core>=0.11; python_version >= '3.9'",
  "scikit-build-core[pyproject]>=0.5; python_version < '3.9'",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["niimath/_dist_ver.py"]
minimum-version = "0.5"
cmake.minimum-version = "3.5"

[tool.setuptools_scm]
write_to = "niimath/_dist_ver.py"
write_to_template = "__version__ = '{version}'\n"

[tool.cibuildwheel]
# Smoke-test every wheel before it can reach PyPI. The script synthesizes NIfTI
# fixtures without third-party dependencies and exercises gzip I/O, the reported
# -conform/-gz 0/-odt char short-read class, anatomical QC, zstd, and packaged feature dispatch.
test-command = "python {project}/.github/scripts/release_smoke.py --expect-bsd --expect-zstd"

[project]
name = "niimath"
description = "NIfTI arithmetic utilities"
readme = "README.md"
requires-python = ">=3.7"
keywords = ["research", "neuroimaging", "neuroscience", "mri", "nifti", "dcm", "nii", "nitrc"]
license = {file = "LICENSE"}
authors = [
  {name = "The niimath developers"}
]
maintainers = [
  {name = "Casper da Costa-Luis", email = "imaging@cdcl.ml"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent"
]
dynamic = ["version"]

[project.scripts]
niimath = "niimath:main"

[project.urls]
repository = "https://github.com/rordenlab/niimath"
changelog = "https://github.com/rordenlab/niimath/releases"
